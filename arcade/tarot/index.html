<html lang="pt">
<head>
  <meta charset="utf-8" />

  <title>Tiragem de Tarot · bylx.dev arcade</title>
  <meta name="description" content="A tarot reading in the browser: 78 cards, upright and reversed, six spreads, in Portuguese or English. Nothing is uploaded — the whole deck runs in this tab." />
  <link rel="canonical" href="https://bylx.dev/arcade/tarot/" />
  <meta property="og:title" content="Tiragem de Tarot · a tarot reading in your browser" />
  <meta property="og:description" content="78 cards, upright and reversed, six spreads, PT/EN, and a reading you can save as PDF. No account, no upload." />
  <meta property="og:url" content="https://bylx.dev/arcade/tarot/" />
  <meta property="og:type" content="website" />

  <link rel="icon" href="/assets/logo/bylx_logo_semdev.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    /* The machine keeps the reading's own clothes — parchment, gold, oxblood,
       garamond — rather than the site's pixel art. A tarot that looks like a
       Game Boy is a different object; the arcade is a shelf of small machines,
       not a house style imposed on all of them. What it does borrow is the
       shell: the back link, the breadcrumb, the focus rings.

       It does not load styles.css for the same reason Cute Gal does not: that
       file carries the scene, the sections, and a cursor: none this would be
       worse for. */
    :root {
      --ink: #15110d;
      --ink2: #1f1a14;
      --parchment: #efe6d2;
      --parchment2: #ddcfa9;
      --gold: #c19a3f;
      --gold-dim: #8a7136;
      --oxblood: #8c2b3c;
      --sage: #6b7a5c;
      --text-dim: #c7bda3;
      --serif: "EB Garamond", Georgia, serif;
      --display: "Cormorant Garamond", Georgia, serif;
      --pixel: "Press Start 2P", monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, var(--ink) 0%, var(--ink2) 100%);
      color: var(--parchment);
      font-family: var(--serif);
      font-size: 17px;
      line-height: 1.5;
    }

    .wrap { max-width: 980px; margin: 0 auto; padding: 14px 20px 72px; }

    a { color: var(--gold); }

    .crumbs { font-family: var(--pixel); font-size: 0.5rem; letter-spacing: 0.08em; color: var(--gold-dim); }
    .crumbs a { text-decoration: none; }
    .crumbs a:hover { text-decoration: underline; }

    .topbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }

    /* ── Language ─────────────────────────────────────────────────────────
       Two buttons, not a <select>: there are exactly two and the current one
       has to be readable at a glance. aria-pressed rather than aria-current,
       because this is a toggle, not navigation. */
    .lang { display: flex; gap: 0; border: 1px solid var(--gold-dim); }

    .lang button {
      appearance: none;
      padding: 6px 12px;
      border: 0;
      background: transparent;
      color: var(--text-dim);
      font-family: var(--pixel);
      font-size: 0.45rem;
      letter-spacing: 0.06em;
      cursor: pointer;
    }

    .lang button[aria-pressed="true"] { background: var(--gold); color: var(--ink); }
    .lang button:focus-visible { outline: 2px solid var(--oxblood); outline-offset: -2px; }

    header.head { text-align: center; margin: 2rem 0 2.5rem; }

    header.head h1 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(1.9rem, 5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--gold);
    }

    header.head p { margin: 0.4rem 0 0; color: var(--text-dim); font-size: 0.95rem; }

    h2 {
      margin: 0 0 0.8rem;
      font-family: var(--display);
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--gold);
    }

    .step { margin-bottom: 2.2rem; }

    .pills { display: flex; flex-wrap: wrap; gap: 8px; }

    .pill {
      appearance: none;
      padding: 8px 16px;
      border: 1px solid var(--gold-dim);
      border-radius: 999px;
      background: transparent;
      color: var(--parchment2);
      font-family: var(--serif);
      font-size: 0.95rem;
      cursor: pointer;
    }

    .pill[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--ink); }
    .pill:focus-visible, .spread:focus-visible, .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

    .spreads { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }

    .spread {
      appearance: none;
      padding: 14px;
      text-align: left;
      border: 1px solid var(--gold-dim);
      border-radius: 8px;
      background: transparent;
      color: var(--parchment);
      font-family: var(--serif);
      cursor: pointer;
    }

    .spread[aria-pressed="true"] { border-color: var(--gold); background: rgba(193, 154, 63, 0.12); }
    .spread b { display: block; font-family: var(--display); font-size: 1.1rem; font-weight: 600; color: var(--gold); }
    .spread span { font-size: 0.85rem; color: var(--text-dim); }

    .btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: var(--oxblood);
      color: var(--parchment);
      font-family: var(--display);
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn--ghost { background: transparent; border-color: var(--gold); color: var(--gold); font-size: 0.9rem; padding: 8px 16px; }
    .btn--quiet { background: transparent; border-color: var(--gold-dim); color: var(--parchment); font-size: 0.9rem; padding: 8px 16px; }

    .go { display: flex; justify-content: center; }

    /* ── Cards ───────────────────────────────────────────────────────────
       No icon library. The original pulled 26 glyphs from lucide-react; here a
       major arcanum shows its Roman numeral and a minor shows its suit mark,
       which is what the cards themselves have always done. One dependency
       fewer and nothing to keep in step. */
    .face {
      width: 116px;
      height: 172px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: var(--parchment);
      border: 2px solid var(--gold);
      border-radius: 6px;
      color: var(--ink);
      flex-shrink: 0;
    }

    .face .mark {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--ink);
      color: var(--gold);
      font-family: var(--display);
      font-size: 1.05rem;
      font-weight: 700;
      transition: transform 0.4s;
    }

    .face[data-reversed] .mark { transform: rotate(180deg); }
    .face .mark svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.6; }

    .face .name { font-family: var(--display); font-size: 0.82rem; font-weight: 700; line-height: 1.15; text-align: center; }
    .face .rev { margin-top: 3px; font-family: var(--pixel); font-size: 0.34rem; letter-spacing: 0.08em; color: var(--oxblood); }

    .draw-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-height: 22rem; overflow-y: auto; padding: 8px; }

    .back {
      width: 46px;
      height: 70px;
      border: 1px solid var(--gold-dim);
      border-radius: 5px;
      background: radial-gradient(circle at 50% 50%, #5e1f2b 0%, transparent 62%), var(--ink2);
      cursor: pointer;
      transition: transform 0.15s;
    }

    .back:hover:not(:disabled) { transform: translateY(-4px); }
    .back:disabled { opacity: 0.15; cursor: default; }
    .back:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    .spread-out { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }
    .slot { width: 190px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .slot .pos { font-family: var(--pixel); font-size: 0.4rem; letter-spacing: 0.06em; color: var(--gold); text-align: center; line-height: 1.6; }
    .slot .read { font-size: 0.88rem; line-height: 1.45; color: var(--text-dim); text-align: center; }

    .synthesis { margin-top: 2.5rem; padding: 20px; border: 1px solid var(--gold-dim); border-radius: 8px; background: rgba(193, 154, 63, 0.08); }
    .synthesis h2 { margin-bottom: 0.5rem; }

    .verdict { margin: 0 0 1.5rem; padding: 14px; text-align: center; border: 1px solid var(--gold-dim); border-radius: 8px; background: rgba(193, 154, 63, 0.1); font-family: var(--display); font-size: 1.2rem; }
    .verdict small { display: block; font-family: var(--serif); font-size: 0.82rem; color: var(--text-dim); }

    .result-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: space-between; margin-bottom: 1.5rem; }
    .result-head .meta { font-size: 0.85rem; color: var(--text-dim); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .export { margin-top: 1.5rem; padding: 14px; border: 1px solid var(--gold-dim); border-radius: 8px; background: rgba(0, 0, 0, 0.25); }
    .export textarea { width: 100%; min-height: 15rem; padding: 12px; background: var(--parchment); color: var(--ink); border: 1px solid var(--gold); border-radius: 6px; font-family: var(--serif); font-size: 0.85rem; line-height: 1.5; resize: vertical; }
    .export .hint { margin: 6px 0 0; font-size: 0.8rem; color: var(--text-dim); }

    .hidden { display: none; }

    .foot { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 2.5rem; }
    .back-link { display: inline-block; font-family: var(--pixel); font-size: 0.45rem; letter-spacing: 0.06em; }

    /* Quiet on purpose. A reading that ends by asking for money loudly is a
       different kind of object; this is the size of the way out, next to it. */
    .kofi {
      padding: 7px 12px;
      border: 1px solid var(--gold-dim);
      border-radius: 999px;
      color: var(--text-dim);
      font-size: 0.85rem;
      text-decoration: none;
    }

    .kofi:hover { border-color: var(--gold); color: var(--gold); }
    .kofi:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

    /* ── Saving as PDF ───────────────────────────────────────────────────
       There is no PDF library here and there should not be: every browser
       prints to PDF, and its typesetting beats anything a 300KB canvas-based
       generator produces — real text, selectable, searchable, at the paper
       size the reader chose. So the button opens the print dialogue and this
       block is the document it prints: ink on white, no controls, nothing
       clipped, and each reading kept whole across a page break. */
    @media print {
      body { background: #fff; color: #15110d; }
      .wrap { max-width: none; padding: 0; }
      .no-print { display: none !important; }
      .face { border-color: #8a7136; }
      .slot .read, .synthesis, .verdict small, .result-head .meta { color: #3a332a; }
      .synthesis, .verdict { background: none; border-color: #8a7136; }
      .slot { break-inside: avoid; page-break-inside: avoid; }
      .print-only { display: block !important; }
    }

    .print-only { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .face .mark, .back { transition: none; }
    }
  </style>
</head>

          P("Futuro próximo", "Near future", "o que se aproxima", "what is coming"),
          P("Atitude", "Your stance", "como te vês nisto", "how you see yourself in this"),
          P("Influências externas", "Outside forces", "forças fora do teu controlo", "what is outside your control"),
          P("Esperanças e medos", "Hopes and fears", "o que desejas e temes", "what you want and what you dread"),
          P("Resultado", "Outcome", "para onde caminha se nada mudar", "where it goes if nothing changes")] },
      { key: "mandala", name: { pt: "Mandala Astrológica", en: "Astrological Mandala" },
        desc: { pt: "12 cartas — as doze casas astrológicas como mapa das áreas da vida.", en: "12 cards — the twelve astrological houses as a map of life's areas." },
        positions: [
          P("Casa 1 — Eu", "House 1 — Self", "identidade, corpo, como te apresentas ao mundo", "identity, body, how you show up"),
          P("Casa 2 — Recursos", "House 2 — Resources", "dinheiro, valores, autoestima material", "money, values, material self-worth"),
          P("Casa 3 — Comunicação", "House 3 — Communication", "mente, palavras, irmãos, o dia a dia próximo", "mind, words, siblings, daily life close by"),
          P("Casa 4 — Lar e raízes", "House 4 — Home and roots", "família, origem, fundação emocional", "family, origin, emotional foundation"),
          P("Casa 5 — Criatividade", "House 5 — Creativity", "prazer, romance, expressão pessoal", "pleasure, romance, self-expression"),
          P("Casa 6 — Rotina e saúde", "House 6 — Routine and health", "trabalho do dia a dia, corpo, hábitos", "daily work, body, habits"),
          P("Casa 7 — Relacionamentos", "House 7 — Relationships", "parcerias, casamento, o outro", "partnership, marriage, the other person"),
          P("Casa 8 — Transformação", "House 8 — Transformation", "o que é partilhado, crises, renascimento", "what is shared, crisis, rebirth"),
          P("Casa 9 — Expansão", "House 9 — Expansion", "crenças, estudos, viagens, sentido maior", "belief, study, travel, larger meaning"),
          P("Casa 10 — Carreira", "House 10 — Career", "propósito público, reputação, vocação", "public purpose, reputation, vocation"),
          P("Casa 11 — Comunidade", "House 11 — Community", "amizades, redes, esperanças de futuro", "friendship, networks, hopes ahead"),
          P("Casa 12 — Inconsciente", "House 12 — The unconscious", "espiritualidade, o que fica escondido, encerramentos", "spirit, what stays hidden, endings")] }
    ];

    /* ── State ──────────────────────────────────────────────────────────── */
    var state = { step: "setup", theme: "geral", spread: "three", mode: "random",
                  deck: [], used: {}, draws: [], date: null, showText: false, copied: false };

    function theme() { return THEMES.filter(function (x) { return x.key === state.theme; })[0]; }
    function spread() { return SPREADS.filter(function (x) { return x.key === state.spread; })[0]; }

    function shuffled() {
      var arr = DECK.map(function (card) { return { card: card, reversed: Math.random() < 0.42 }; });
      var i, j, tmp;
      for (i = arr.length - 1; i > 0; i--) {
        j = Math.floor(Math.random() * (i + 1));
        tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
      return arr;
    }

    /* ── Reading ────────────────────────────────────────────────────────── */
    function interpret(d, pos) {
      var meaning = t(d.reversed ? d.card.reversed.meaning : d.card.upright.meaning);
      var orient = t(d.reversed ? UI.revLong : UI.upLong);
      var desc = t(pos.desc) ? " (" + t(pos.desc) + ")" : "";
      if (lang === "pt") {
        return t(theme().intro) + ', na posição "' + t(pos.label) + '"' + desc + ", " + t(d.card.name) + " " + orient + " sugere: " + meaning;
      }
      return t(theme().intro) + ', in the "' + t(pos.label) + '" position' + desc + ", " + t(d.card.name) + " " + orient + " suggests: " + meaning;
    }

    function synthesis() {
      var draws = state.draws, sp = spread(), total = draws.length;
      var rev = draws.filter(function (d) { return d.reversed; }).length;
      var major = draws.filter(function (d) { return d.card.arcana === "major"; }).length;
      var counts = {}, dominant = null;
      draws.forEach(function (d) { if (d.card.suit) counts[d.card.suit] = (counts[d.card.suit] || 0) + 1; });
      Object.keys(counts).forEach(function (k) { if (!dominant || counts[k] > counts[dominant]) dominant = k; });

      var out = t(theme().intro) + (lang === "pt"
        ? ", esta tiragem reúne " + total + " carta" + (total > 1 ? "s" : "") + ". "
        : ", this reading holds " + total + " card" + (total > 1 ? "s" : "") + ". ");

      if (total === 1) {
        var d0 = draws[0];
        out += lang === "pt"
          ? t(d0.card.name) + (d0.reversed ? " invertida" : "") + " é, hoje, a energia que mais precisa da tua atenção."
          : t(d0.card.name) + (d0.reversed ? " reversed" : "") + " is the energy asking for your attention today.";
        return out;
      }

      out += major / total >= 0.4
        ? (lang === "pt"
            ? "Com " + major + " arcano" + (major > 1 ? "s" : "") + " maior" + (major > 1 ? "es" : "") + " em jogo, o tema pesa mais do que o dia a dia — há forças de fundo, quase arquetípicas, e não só pequenas decisões. "
            : "With " + major + " major arcan" + (major > 1 ? "a" : "um") + " in play, this weighs more than the everyday — there are deep, almost archetypal forces here, not just small decisions. ")
        : (lang === "pt"
            ? "Predominam arcanos menores, o que sugere que isto se resolve mais no terreno prático do dia a dia do que em grandes reviravoltas. "
            : "Minor arcana dominate, which suggests this resolves on practical, everyday ground rather than through some great turn. ");

      out += rev / total >= 0.6
        ? (lang === "pt" ? "A maioria das cartas saiu invertida — há energia represada, processos ainda por destravar. Vale desacelerar antes de agir. "
                         : "Most cards came up reversed — energy is dammed and processes are not yet unstuck. Worth slowing down before acting. ")
        : rev === 0
        ? (lang === "pt" ? "Todas as cartas saíram eretas — a energia flui sem grandes bloqueios internos, o que favorece agir com mais confiança. "
                         : "Every card came up upright — the energy runs with no great inner blockage, which favours acting with confidence. ")
        : (lang === "pt" ? "Há equilíbrio entre energia a fluir e energia represada — parte da situação já está pronta para avançar, outra parte ainda pede paciência. "
                         : "There is a balance between energy flowing and energy held — part of this is ready to move, part of it still asks for patience. ");

      if (dominant && counts[dominant] >= Math.max(2, Math.ceil(total * 0.3))) {
        var suit = SUITS.filter(function (s) { return s.key === dominant; })[0];
        if (suit) {
          out += lang === "pt"
            ? "O naipe de " + t(suit.name) + " aparece com destaque, apontando " + t(suit.domain) + " como o eixo real por trás do resto. "
            : "The suit of " + t(suit.name) + " stands out, pointing at " + t(suit.domain) + " as the real axis behind the rest. ";
        }
      }

      var last = draws[draws.length - 1];
      var lastPos = t(sp.positions[sp.positions.length - 1].label);
      out += lang === "pt"
        ? 'Vale olhar com atenção especial para "' + lastPos + '" (' + t(last.card.name) + (last.reversed ? " invertida" : "") + ") antes de decidir o próximo passo."
        : 'It is worth looking hard at "' + lastPos + '" (' + t(last.card.name) + (last.reversed ? " reversed" : "") + ") before deciding the next step.";
      return out;
    }

    function verdict() {
      var up = state.draws.filter(function (d) { return !d.reversed; }).length;
      return up >= 2 ? { label: t(UI.yes), tone: "var(--sage)" } : { label: t(UI.no), tone: "var(--oxblood)" };
    }

    function dateLabel() {
      if (!state.date) return "";
      var loc = lang === "pt" ? "pt-PT" : "en-GB";
      return state.date.toLocaleDateString(loc, { day: "2-digit", month: "long", year: "numeric" }) +
             " " + t(UI.at) + " " + state.date.toLocaleTimeString(loc, { hour: "2-digit", minute: "2-digit" });
    }

    function exportText() {
      var sp = spread(), lines = [];
      lines.push(t(UI.exTitle));
      lines.push(t(UI.exDate) + ": " + dateLabel());
      lines.push(t(UI.exTheme) + ": " + t(theme().label));
      lines.push(t(UI.exSpread) + ": " + t(sp.name));
      if (sp.special === "yesno") lines.push(verdict().label);
      lines.push("");
      state.draws.forEach(function (d, i) {
        lines.push((i + 1) + ". " + t(sp.positions[i].label) + " — " + t(d.card.name) +
          " (" + t(d.reversed ? UI.revLong : UI.upLong) + ")");
        lines.push(interpret(d, sp.positions[i]));
        lines.push("");
      });
      lines.push(t(UI.exGeneral));
      lines.push(synthesis());
      return lines.join("\n");
    }

    /* ── Rendering ──────────────────────────────────────────────────────── */
    var app = document.getElementById("app");

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function faceHTML(d) {
      var mark = d.card.arcana === "major" ? esc(d.card.numeral) : MARKS[d.card.mark];
      return '<div class="face"' + (d.reversed ? " data-reversed" : "") + '>' +
        '<div class="mark">' + mark + '</div>' +
        '<div><div class="name">' + esc(t(d.card.name)) + '</div>' +
        (d.reversed ? '<div class="rev">' + esc(t(UI.reversed)) + "</div>" : "") +
        "</div></div>";
    }

    function setupHTML() {
      var sp = spread();
      return '<div class="step"><h2>' + esc(t(UI.step1)) + "</h2>" +
        '<div class="pills">' + THEMES.map(function (x) {
          return '<button type="button" class="pill" data-theme="' + x.key + '" aria-pressed="' +
            (state.theme === x.key) + '">' + esc(t(x.label)) + "</button>";
        }).join("") + "</div></div>" +

        '<div class="step"><h2>' + esc(t(UI.step2)) + "</h2><div class=\"spreads\">" +
        SPREADS.map(function (x) {
          var n = x.positions.length;
          return '<button type="button" class="spread" data-spread="' + x.key + '" aria-pressed="' +
            (state.spread === x.key) + '"><b>' + esc(t(x.name)) + " · " + n + " " +
            esc(t(n > 1 ? UI.cards : UI.card1)) + "</b><span>" + esc(t(x.desc)) + "</span></button>";
        }).join("") + "</div></div>" +

        '<div class="step"><h2>' + esc(t(UI.step3)) + "</h2>" +
        '<div class="pills">' +
        '<button type="button" class="pill" data-mode="manual" aria-pressed="' + (state.mode === "manual") + '">' + esc(t(UI.manual)) + "</button>" +
        '<button type="button" class="pill" data-mode="random" aria-pressed="' + (state.mode === "random") + '">' + esc(t(UI.random)) + "</button>" +
        "</div></div>" +

        '<div class="go"><button type="button" class="btn" data-go>' +
        esc(t(state.mode === "manual" ? UI.goManual : UI.goRandom)) + " →</button></div>";
    }

    function drawHTML() {
      var sp = spread(), pos = sp.positions[state.draws.length];
      return '<button type="button" class="btn btn--quiet" data-reset>' + esc(t(UI.goBack)) + "</button>" +
        '<div style="text-align:center;margin:1.5rem 0 0.5rem">' +
        '<h2 style="margin:0">' + esc(t(UI.pickFor)) + " " + esc(t(pos.label)) + "</h2>" +
        (t(pos.desc) ? '<p style="margin:.2rem 0 0;color:var(--text-dim);font-size:.9rem">' + esc(t(pos.desc)) + "</p>" : "") +
        '<p style="margin:.4rem 0 0;color:var(--text-dim);font-size:.85rem">' +
        state.draws.length + " " + esc(t(UI.chosen)) + " " + sp.positions.length + "</p></div>" +
        '<div class="draw-grid">' + state.deck.map(function (_, i) {
          return '<button type="button" class="back" data-pick="' + i + '"' +
            (state.used[i] ? " disabled" : "") + ' aria-label="' + esc(t(UI.pickFor)) + " " + esc(t(pos.label)) + '"></button>';
        }).join("") + "</div>";
    }

    function resultHTML() {
      var sp = spread();
      var v = sp.special === "yesno" ? verdict() : null;
      return '<div class="result-head">' +
        "<div><h2 style=\"margin:0\">" + esc(t(sp.name)) + " · " + esc(t(theme().label)) + "</h2>" +
        '<p class="meta" style="margin:.2rem 0 0">' + esc(dateLabel()) + "</p></div>" +
        '<div class="actions no-print">' +
        '<button type="button" class="btn btn--ghost" data-pdf>' + esc(t(UI.savePdf)) + "</button>" +
        '<button type="button" class="btn btn--ghost" data-text>' + esc(t(state.showText ? UI.hideText : UI.showText)) + "</button>" +
        '<button type="button" class="btn btn--quiet" data-reset>' + esc(t(UI.again)) + "</button>" +
        "</div></div>" +

        (v ? '<div class="verdict" style="color:' + v.tone + '">' + esc(v.label) +
             "<small>" + esc(t(UI.yesNote)) + "</small></div>" : "") +

        '<div class="spread-out">' + state.draws.map(function (d, i) {
          return '<div class="slot"><div class="pos">' + (i + 1) + ". " + esc(t(sp.positions[i].label)) + "</div>" +
            faceHTML(d) + '<div class="read">' + esc(interpret(d, sp.positions[i])) + "</div></div>";
        }).join("") + "</div>" +

        '<div class="synthesis"><h2>' + esc(t(UI.general)) + "</h2><p style=\"margin:0\">" + esc(synthesis()) + "</p></div>" +

        (state.showText ? '<div class="export no-print"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px">' +
          "<h2 style=\"margin:0\">" + esc(t(UI.textTitle)) + "</h2>" +
          '<button type="button" class="btn btn--ghost" data-copy>' + esc(t(state.copied ? UI.copied : UI.copy)) + "</button></div>" +
          '<textarea id="export-area" readonly>' + esc(exportText()) + "</textarea>" +
          '<p class="hint">' + esc(t(UI.copyHint)) + "</p></div>" : "");
    }

    function render() {
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var key = el.getAttribute("data-i18n");
        if (UI[key]) el.textContent = t(UI[key]);
      });
      document.querySelectorAll(".lang button").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
      });
      app.innerHTML = state.step === "setup" ? setupHTML() : state.step === "draw" ? drawHTML() : resultHTML();
    }

    /* One listener on the container rather than one per control: the screens
       are replaced wholesale on every render, and per-node listeners would be
       rebound (or leaked) every time. */
    app.addEventListener("click", function (event) {
      var el = event.target.closest("[data-theme],[data-spread],[data-mode],[data-go],[data-pick],[data-reset],[data-text],[data-copy],[data-pdf]");
      if (!el) return;

      if (el.dataset.theme) { state.theme = el.dataset.theme; return render(); }
      if (el.dataset.spread) { state.spread = el.dataset.spread; return render(); }
      if (el.dataset.mode) { state.mode = el.dataset.mode; return render(); }

      if (el.hasAttribute("data-go")) {
        var fresh = shuffled();
        if (state.mode === "random") {
          state.draws = fresh.slice(0, spread().positions.length);
          state.date = new Date();
          state.step = "result";
        } else {
          state.deck = fresh; state.used = {}; state.draws = []; state.step = "draw";
        }
        return render();
      }

      if (el.hasAttribute("data-pick")) {
        var i = +el.dataset.pick;
        if (state.used[i] || state.draws.length >= spread().positions.length) return;
        state.used[i] = true;
        state.draws.push(state.deck[i]);
        if (state.draws.length === spread().positions.length) { state.date = new Date(); state.step = "result"; }
        return render();
      }

      if (el.hasAttribute("data-reset")) {
        state.step = "setup"; state.draws = []; state.deck = []; state.used = {};
        state.date = null; state.showText = false; state.copied = false;
        return render();
      }

      if (el.hasAttribute("data-text")) { state.showText = !state.showText; state.copied = false; return render(); }

      /* No PDF library. Every browser prints to PDF, its typesetting beats a
         canvas-based generator, and the output is real selectable text. */
      if (el.hasAttribute("data-pdf")) { window.print(); return; }

      if (el.hasAttribute("data-copy")) {
        var text = exportText();
        var done = function () { state.copied = true; render(); setTimeout(function () { state.copied = false; render(); }, 2000); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, fallback);
        } else { fallback(); }
        function fallback() {
          var ta = document.getElementById("export-area");
          if (!ta) return;
          ta.focus(); ta.select();
          try { document.execCommand("copy"); done(); } catch (e) { /* the text is selected; Ctrl+C works */ }
        }
      }
    });

    document.querySelector(".lang").addEventListener("click", function (event) {
      var b = event.target.closest("[data-lang]");
      if (!b || b.dataset.lang === lang) return;
      lang = b.dataset.lang;
      try { localStorage.setItem("bylx-tarot-lang", lang); } catch (e) {}
      render();
    });

    render();
  })();
  </script>
</body>
</html>
