<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 22px 24px; background: #09051b; color: var(--bylx-text); }
  h4 { font-family: var(--font-ui); font-size: 9px; text-transform: uppercase; color: var(--bylx-cyan); margin: 0 0 10px; letter-spacing: 0; }
  .stack { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }
  .col p { font-family: var(--font-display); font-size: 16px; line-height: 1.2; margin: 0 0 4px; }
  .muted { color: var(--bylx-muted) !important; }
  .accent { color: var(--bylx-pink); }
  .accent2 { color: var(--bylx-cyan); }
  .chip { display: inline-block; padding: 6px 10px; border: 3px solid var(--bylx-bg); background: var(--bylx-pink); color: var(--bylx-bg); font-family: var(--font-display); font-size: 13px; font-weight: 600; text-transform: uppercase; margin: 4px 6px 0 0; box-shadow: 4px 4px 0 var(--bylx-cyan); }
  .chip.alt { background: var(--bylx-cyan); box-shadow: 4px 4px 0 var(--bylx-pink); }
</style></head>
<body>
  <div class="stack">
    <div class="col">
      <h4>Text on dark</h4>
      <p>Primary on bg</p>
      <p class="muted">Muted secondary</p>
      <p class="accent2">Cyan link / eyebrow</p>
      <p class="accent">Pink accent inline</p>
    </div>
    <div class="col">
      <h4>Accents in use</h4>
      <span class="chip">View projects</span>
      <span class="chip alt">Say hi</span>
    </div>
  </div>
</body></html>
