<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 22px; background: #09051b; color: var(--bylx-text); }
  .row { display: flex; align-items: flex-end; gap: 12px; }
  .bar { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .swatch { background: var(--bylx-cyan); border: 2px solid var(--bylx-bg); width: 36px; }
  .tag { font-family: var(--font-ui); font-size: 7px; color: var(--bylx-cyan); text-transform: uppercase; }
  .val { font-family: var(--font-display); font-size: 13px; color: var(--bylx-muted); }
  .title { font-family: var(--font-ui); font-size: 9px; color: var(--bylx-cyan); text-transform: uppercase; margin: 0 0 14px; }
</style></head>
<body>
  <p class="title">Spacing — 4px base unit</p>
  <div class="row">
    <div class="bar"><div class="swatch" style="height:4px"></div><span class="tag">1</span><span class="val">4</span></div>
    <div class="bar"><div class="swatch" style="height:8px"></div><span class="tag">2</span><span class="val">8</span></div>
    <div class="bar"><div class="swatch" style="height:12px"></div><span class="tag">3</span><span class="val">12</span></div>
    <div class="bar"><div class="swatch" style="height:16px"></div><span class="tag">4</span><span class="val">16</span></div>
    <div class="bar"><div class="swatch" style="height:24px"></div><span class="tag">5</span><span class="val">24</span></div>
    <div class="bar"><div class="swatch" style="height:32px"></div><span class="tag">6</span><span class="val">32</span></div>
    <div class="bar"><div class="swatch" style="height:48px"></div><span class="tag">7</span><span class="val">48</span></div>
    <div class="bar"><div class="swatch" style="height:64px"></div><span class="tag">8</span><span class="val">64</span></div>
  </div>
</body></html>
