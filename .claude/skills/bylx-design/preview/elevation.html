<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 22px; background: #f7f5fb; color: var(--bylx-bg); }
  .title { font-family: var(--font-ui); font-size: 9px; color: var(--bylx-bg); text-transform: uppercase; margin: 0 0 14px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .demo { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 84px; height: 84px; background: var(--bylx-paper); border: 4px solid var(--bylx-bg); position: relative; }
  .box.s { box-shadow: 4px 4px 0 var(--bylx-pink); }
  .box.m { box-shadow: 7px 7px 0 var(--bylx-pink); }
  .box.l { box-shadow: 9px 9px 0 var(--bylx-pink); }
  .box.c { box-shadow: 6px 6px 0 var(--bylx-cyan); }
  .tag { font-family: var(--font-ui); font-size: 7px; text-transform: uppercase; }
  .val { font-family: var(--font-display); font-size: 12px; color: #555; }
</style></head>
<body>
  <p class="title">Elevation — hard-offset pixel shadows (never blurred)</p>
  <div class="row">
    <div class="demo"><div class="box s"></div><span class="tag">Chip</span><span class="val">4 4 0 pink</span></div>
    <div class="demo"><div class="box m"></div><span class="tag">Card</span><span class="val">7 7 0 pink</span></div>
    <div class="demo"><div class="box l"></div><span class="tag">Modal</span><span class="val">9 9 0 pink</span></div>
    <div class="demo"><div class="box c"></div><span class="tag">Alt</span><span class="val">6 6 0 cyan</span></div>
  </div>
</body></html>
