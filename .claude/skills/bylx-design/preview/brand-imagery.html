<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 0; background: #09051b; color: var(--bylx-text); display: flex; align-items: stretch; height: 200px; }
  .poster { width: 38%; background: #5d3fd3; display: flex; align-items: center; justify-content: center; padding: 14px; box-sizing: border-box; }
  .poster img { image-rendering: pixelated; max-height: 100%; width: auto; box-shadow: 5px 5px 0 var(--bylx-pink); }
  .copy { flex: 1; padding: 18px 22px; }
  .title { font-family: var(--font-ui); font-size: 9px; color: var(--bylx-cyan); text-transform: uppercase; margin: 0 0 10px; }
  h3 { font-family: var(--font-display); font-size: 24px; line-height: 1.05; margin: 0 0 8px; }
  p { font-family: var(--font-display); font-size: 14px; line-height: 1.2; color: var(--bylx-muted); margin: 0; }
</style></head>
<body>
  <div class="poster"><img src="../assets/hero/japan_poster.png" alt=""/></div>
  <div class="copy">
    <p class="title">Imagery vibe</p>
    <h3>Pixel posters, warm desk, cool sky</h3>
    <p>Sakura, Mt. Fuji, neon kanji — Japan poster sits on the CRT and supplies the city-pop / synthwave music vocabulary.</p>
  </div>
</body></html>
