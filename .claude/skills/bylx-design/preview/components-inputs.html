<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 22px; background: #09051b; color: var(--bylx-text); }
  .title { font-family: var(--font-ui); font-size: 9px; color: var(--bylx-cyan); text-transform: uppercase; margin: 0 0 14px; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; align-items: end; }
  label { display: grid; gap: 4px; font-family: var(--font-ui); font-size: 7px; color: var(--bylx-cyan); text-transform: uppercase; }
  input, textarea { font-family: var(--font-display); font-size: 14px; padding: 8px 10px; border: 3px solid var(--bylx-bg); background: #fff8ff; color: var(--bylx-bg); outline: none; }
  input:focus, textarea:focus { box-shadow: 0 0 0 3px rgba(89,243,255,0.9); }
  textarea { grid-column: 1 / -1; min-height: 32px; resize: vertical; }
</style></head>
<body>
  <p class="title">Form inputs — paper fill, dark stroke, cyan focus ring</p>
  <form>
    <label>Name<input type="text" value="Aline" /></label>
    <label>Email<input type="email" value="hi@bylx.dev" /></label>
    <label>Message<textarea>Hi! Just left a note from the diorama.</textarea></label>
  </form>
</body></html>
