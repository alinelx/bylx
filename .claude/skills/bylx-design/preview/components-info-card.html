<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 18px 22px; background: #5d3fd3; color: var(--bylx-text); }
  .panel { width: 86%; padding: 14px 16px 18px; background: rgba(9,5,27,0.78); border: 7px solid var(--bylx-cyan); box-shadow: 7px 7px 0 var(--bylx-pink); text-shadow: 1px 1px 0 rgba(9,5,27,0.88); }
  .eyebrow { font-family: "Press Start 2P", monospace; font-size: 10px; color: var(--bylx-cyan); margin: 0 0 8px; text-transform: uppercase; -webkit-font-smoothing: none; }
  h1 { font-family: var(--font-display); font-size: 32px; line-height: 0.96; font-weight: 500; max-width: 14ch; margin: 0 0 8px; }
  p { font-family: var(--font-display); font-size: 14px; line-height: 1.16; margin: 0 0 12px; max-width: 28ch; }
  a.cta { display: inline-block; font-family: "Press Start 2P", monospace; font-size: 11px; padding: 9px 11px; color: var(--bylx-cyan); background: var(--bylx-pink); border: 2px solid rgba(9,5,27,0.72); text-decoration: none; text-transform: uppercase; -webkit-font-smoothing: none; }
</style></head>
<body>
  <section class="panel">
    <p class="eyebrow">FRONT-END DEVELOPER IN PROGRESS</p>
    <h1>Designing playful, useful web experiences</h1>
    <p>I'm Aline, a software engineering student building creative front-end projects.</p>
    <a class="cta" href="#">VIEW PROJECTS</a>
  </section>
</body></html>
