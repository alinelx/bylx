<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 18px 22px; background: #09051b; color: var(--bylx-text); }
  .title { font-family: var(--font-ui); font-size: 9px; color: var(--bylx-cyan); text-transform: uppercase; margin: 0 0 12px; }
  .mp3 { width: 88%; padding: 12px 14px; background: rgba(9,5,27,0.9); border: 4px solid var(--bylx-cyan); box-shadow: 6px 6px 0 var(--bylx-pink); }
  .mp3 p { font-family: var(--font-display); font-size: 15px; margin: 0 0 10px; }
  .mp3 p span { color: var(--bylx-pink); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font-family: "Press Start 2P", monospace; font-size: 9px; padding: 7px 9px; border: 3px solid var(--bylx-bg); background: var(--bylx-pink); color: var(--bylx-bg); text-transform: uppercase; -webkit-font-smoothing: none; cursor: pointer; }
</style></head>
<body>
  <p class="title">MP3 controls — fixed-position floating panel</p>
  <div class="mp3">
    <p>Now playing: <span>tavccitypop neon dreams</span></p>
    <div class="row">
      <button>PLAY</button><button>PAUSE</button><button>STOP</button><button>VOL -</button><button>VOL +</button>
    </div>
  </div>
</body></html>
