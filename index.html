<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bylx.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main>
    <section class="hero hero-scene" id="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow">Front-end developer in progress</p>
        <h1 id="hero-title">Designing playful, useful web experiences.</h1>
        <p>
          I’m Aline, a software engineering student building creative front-end projects with HTML, CSS, JavaScript and React.
        </p>
        <a href="#projects">View projects</a>
      </div>

      <div class="scene" aria-hidden="true">
        <div class="bg-wrap">
          <img class="bg left left-top" src="assets/hero/gradient.png" alt="" />
          <img class="bg left left-middle" src="assets/hero/gradient.png" alt="" />
          <img class="bg left left-bottom" src="assets/hero/gradient.png" alt="" />
          <img class="bg top" src="assets/hero/gradient.png" alt="" />
          <img class="bg right right-top" src="assets/hero/gradient.png" alt="" />
          <img class="bg right right-middle" src="assets/hero/gradient.png" alt="" />
          <img class="bg right right-bottom" src="assets/hero/gradient.png" alt="" />
          <img class="bg bottom" src="assets/hero/gradient.png" alt="" />
        </div>

        <img class="layer skyline-far morro morro-left flipped" src="assets/hero/morro.png" alt="" />
        <img class="layer skyline-far morro morro-right" src="assets/hero/morro.png" alt="" />
        <img class="layer skyline-far cristo" src="assets/hero/cristo_redentor.png" alt="" />
        <img class="layer skyline-far pao-de-acucar" src="assets/hero/pao_de_acucar.png" alt="" />
        <img class="layer skyline-far ponte" src="assets/hero/ponte_25abril.png" alt="" />
        <img class="layer skyline-far torre-belem" src="assets/hero/torre_belem.png" alt="" />

        <img class="layer window-frame" src="assets/hero/window_frame.png" alt="" />
        <img class="layer table" src="assets/hero/table.png" alt="" />
        <img class="layer win-bg" src="assets/hero/win_background.png" alt="" />

        <div class="desktop-icons parallax-item">
          <img class="icon" src="assets/hero/node_icon.png" alt="" />
          <img class="icon" src="assets/hero/react_icon.png" alt="" />
          <img class="icon" src="assets/hero/typescript_icon.png" alt="" />
          <img class="icon" src="assets/hero/figma_icon.png" alt="" />
          <img class="icon" src="assets/hero/wordpress_icon.png" alt="" />
          <img class="icon" src="assets/hero/javascript_icon.png" alt="" />
          <img class="icon" src="assets/hero/css_icon.png" alt="" />
          <img class="icon" src="assets/hero/html_icon.png" alt="" />
        </div>

        <div class="pixel-window parallax-item">
          <div class="win top-left"></div>
          <div class="win top-middle"><p class="window-title">nihon.bmp</p></div>
          <div class="win top-right"></div>
          <div class="win side-left"></div>
          <div class="win-content"><img src="assets/hero/japan_poster.png" class="poster" alt="" /></div>
          <div class="win side-right"></div>
          <div class="win bottom-left"></div>
          <div class="win bottom-middle"></div>
          <div class="win bottom-right"></div>
        </div>

        <img class="layer paint" src="assets/hero/paint_frame.png" alt="" />
        <div class="toolbar-strip parallax-item">
          <img class="toolbar toolbar-start" src="assets/hero/toolbar.png" alt="" />
          <img class="toolbar toolbar-fill" src="assets/hero/toolbar.png" alt="" />
        </div>
        <img class="layer monitor" src="assets/hero/monitor_frame.png" alt="" />

        <img class="layer instax" src="assets/hero/instax.png" alt="" />
        <img class="layer mp3player" src="assets/hero/mp3_player.png" alt="" />
        <img class="layer cocktail" src="assets/hero/cocktail.png" alt="" />
        <img class="layer sushi" src="assets/hero/sushi.png" alt="" />
        <img class="layer phone" src="assets/hero/phone.png" alt="" />
        <img class="layer mouse" src="assets/hero/mouse.png" alt="" />
        <img class="layer keyboard keyboard-board" src="assets/hero/keyboard_board.png" alt="" />
        <img class="layer keyboard keyboard-keys" src="assets/hero/keyboard_keys.png" alt="" />
        <img class="layer bylx-logo" src="assets/hero/bylx_logo.png" alt="" />
      </div>
    </section>

    <section class="placeholder-section" id="projects" aria-labelledby="projects-title">
      <h2 id="projects-title">Projects</h2>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
