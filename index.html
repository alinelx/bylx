<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bylx.dev</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <section class="hero" style="width: 100%;" id="hero">
        <div class="bg-wrap" style="width:100%;">
          <img class="bg left" src="assets/hero/gradient.png">
          <img class="bg top" src="assets/hero/gradient.png">
          <img class="bg right" src="assets/hero/gradient.png">
        </div>
        
        <img class="layer skyline-far" style="left: 50%; top: 33%; width:25%;" src="assets/hero/morro.png" alt="" />
        <img class="layer skyline-far" style="left: 25%; top: 33%; width:25%; transform: scaleX(-1);" src="assets/hero/morro.png" alt="" />
        <img class="layer skyline-far" style="left: 34%; top: 20%; width: 20%;" src="assets/hero/cristo_redentor.png" alt="" />
        <img class="layer skyline-far" style="left: 15%; top: 40%; width:25%;" src="assets/hero/pao_de_acucar.png" alt="" />
        <img class="layer skyline-far" style="left: 50%; top: 30%; width: 25%;" src="assets/hero/ponte_25abril.png" alt="" />
        <img class="layer skyline-far" style="left: 55%; top: 40%; width:25%;" src="assets/hero/torre_belem.png" alt="" />
        <img class="bg left" style="top: 40%" src="assets/hero/gradient.png">
        <img class="bg right" style="top: 40%" src="assets/hero/gradient.png">
        <img class="bg left" style="top: 80%" src="assets/hero/gradient.png">
        <img class="bg right" style="top: 80%" src="assets/hero/gradient.png">
        <img class="bg bottom" src="assets/hero/gradient.png">
        <img class="layer bylx-logo" src="assets/hero/bylx_logo.png" alt="" />
        <img class="layer window-frame" src="assets/hero/window_frame.png" alt="" />        
        <img class="layer table" src="assets/hero/table.png" alt="" />
        <img class="layer instax" src="assets/hero/instax.png" alt="" />
        <img class="layer mp3player" src="assets/hero/mp3_player.png" alt="" />
        <img class="layer cocktail" src="assets/hero/cocktail.png" alt="" />
        <img class="layer sushi" src="assets/hero/sushi.png" alt="" />
        <img class="layer phone" src="assets/hero/phone.png" alt="" />
        <img class="layer win-bg" src="assets/hero/win_background.png" alt="" />
        <div class="desktop-icons">
          <img class="icon" src="assets/hero/node_icon.png" alt="" />
          <img class="icon" src="assets/hero/react_icon.png" alt="" />
          <img class="icon" src="assets/hero/typescript_icon.png" alt="" />
          <img class="icon" src="assets/hero/figma_icon.png" alt="" />
          <img class="icon" src="assets/hero/wordpress_icon.png" alt="" />
          <img class="icon" src="assets/hero/javascript_icon.png" alt="" />
          <img class="icon" src="assets/hero/css_icon.png" alt="" />
          <img class="icon" src="assets/hero/html_icon.png" alt="" />
        </div>
        <div class="pixel-window">
          <div class="win top-left"></div>
          <div class="win top-middle">
            <p style="color:#0b0820; margin-top: 5%; font-family: 'Courier', monospace; font-smooth: never; -webkit-font-smoothing : none; font-size: medium; font-weight: bolder;">              nihon.bmp
            </p>
          </div>
          <div class="win top-right"></div>

          <div class="win side-left"></div>
          <div class="win-content">
            <img src="assets/hero/japan_poster.png" class="poster" alt="" />
          </div>
          <div class="win side-right"></div>

          <div class="win bottom-left"></div>
          <div class="win bottom-middle"></div>
          <div class="win bottom-right"></div>

        </div>
        <img class="layer paint" src="assets/hero/paint_frame.png" alt="" />
        <img class="layer toolbar" style="left:45%" src="assets/hero/toolbar.png" alt="" />
        <img class="layer toolbar" src="assets/hero/toolbar.png" alt="" />
        <img class="layer monitor" src="assets/hero/monitor_frame.png" alt="" />
        <img class="layer mouse" src="assets/hero/mouse.png" alt="" />
        <img class="layer keyboard" src="assets/hero/keyboard_board.png" alt="" />
        <img class="layer keyboard" src="assets/hero/keyboard_keys.png" alt="" />
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
