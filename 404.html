<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>404 · bylx</title>
  <meta name="description" content="This page does not exist on bylx.dev." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#09051b" />

  <link rel="icon" href="/assets/logo/bylx_logo_line.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&display=swap"
    rel="stylesheet"
  />

  <!-- Deliberately standalone: no styles.css, no script.js. A 404 that depends
       on the hero scene is a 404 that can break for the same reason the page
       it is apologising for broke. Absolute asset paths — this renders at any
       depth the visitor mistyped. -->
  <style>
    :root {
      --bg: #09051b;
      --cyan: #59f3ff;
      --pink: #ff5dbb;
      --text: #f7f2ff;
      --purple: #5d3fd3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: "Pixelify Sans", system-ui, sans-serif;
      text-align: center;
    }

    .box {
      max-width: 34rem;
      padding: 2rem 1.75rem;
      background: rgba(93, 63, 211, 0.7);
      border: 7px solid var(--cyan);
      box-shadow: 7px 7px 0 var(--pink);
    }

    .code {
      margin: 0 0 0.75rem;
      color: var(--cyan);
      font-family: "Press Start 2P", monospace;
      font-size: 0.7rem;
      text-transform: uppercase;
      -webkit-font-smoothing: none;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 6vw, 2.6rem);
      font-weight: 400;
      line-height: 1.05;
    }

    p {
      margin: 0.9rem 0 0;
      font-size: clamp(0.85rem, 2.4vw, 1.05rem);
      line-height: 1.3;
    }

    a {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.6rem 0.9rem;
      color: var(--bg);
      background: var(--pink);
      border: 2px solid var(--cyan);
      font-family: "Press Start 2P", monospace;
      font-size: 0.62rem;
      line-height: 1;
      text-decoration: none;
      text-transform: uppercase;
      -webkit-font-smoothing: none;
    }

    a:hover,
    a:focus-visible {
      outline: none;
      box-shadow: 4px 4px 0 rgba(89, 243, 255, 0.82);
    }

    img {
      width: 64px;
      margin: 0 auto 1.25rem;
      image-rendering: pixelated;
    }
  </style>
</head>

<body>
  <main class="box">
    <img src="/assets/logo/bylx_logo_line.png" alt="" />
    <p class="code">Error 404</p>
    <h1>This desk has no such drawer.</h1>
    <p>The page you asked for isn't here — but the work is one click away.</p>
    <a href="/">Back to the desk</a>
  </main>
</body>
</html>
