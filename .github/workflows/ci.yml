# Checks every push to main. It does NOT deploy.
#
# This started life as an FTP deploy, and it should not have: the site was
# already deploying itself. hPanel has the repo connected with "Implementação
# Automática" on, and it published 5b07511 into public_html seven seconds after
# the push. Two things writing into the same web root is worse than one, so the
# upload is gone and the checks stayed.
#
# Worth being honest about what that leaves: this is a check, not a gate.
# Hostinger deploys straight from the push, so a red X here shows up NEXT TO a
# deploy that already happened. It tells you to fix and push again; it holds
# nothing back.
#
# To make it a real gate: turn "Implementação Automática" off in hPanel and
# restore the FTP steps from commit 19749c1 — they carry the two-pass upload
# that puts index.html last, because the edge caches by URL and would otherwise
# cache the new ?v= hashes against files that are still the old ones. That
# trades a seven second deploy for a five minute one that cannot publish a
# broken build.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Would the stamper or the page generator change anything? Then what is
      # committed is not what should ship. Shipping a stale ?v= is how the CDN
      # ends up handing out last week's CSS — measured, see CLAUDE.md.
      - name: Check the build is current
        run: npm run predeploy

      # Both Playwright projects are Chromium, so this is one browser download.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Nothing here builds, so "it compiled" proves nothing. The suite is the
      # only check there is.
      - name: Test
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
