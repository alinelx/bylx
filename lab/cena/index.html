<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>bylx · laboratório — a cena em canvas</title>
  <!-- Escrita à mão, como arcade/ e chegada/. Página de ensaio: a cena do hero
       redesenhada numa grade de 640x360 e ampliada por inteiros. Não entra no
       sitemap. Quando estiver aprovada, o hero passa a usar js/scene-canvas.js. -->
  <style>
    :root { --bg: #09051b; --ink: #f7f2ff; --cyan: #59f3ff; --pink: #ff5dbb; --purple: #5d3fd3; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--purple); color: var(--ink); font: 16px/1.4 system-ui, sans-serif; }
    .stage { position: fixed; inset: 0; overflow: hidden; }
    .scene-canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; }
    .scene-hotspots { position: absolute; inset: 0; }
    .scene-hotspot { position: absolute; padding: 0; border: 0; background: transparent; cursor: pointer; }
    .scene-hotspot:focus-visible { outline: 2px dashed var(--pink); outline-offset: 2px; }
    .panel { position: fixed; right: 12px; bottom: 12px; z-index: 2; display: grid; gap: 6px; padding: 10px 12px;
      background: var(--bg); border: 2px solid var(--cyan); box-shadow: 4px 4px 0 var(--purple); font-size: 13px; max-width: 320px; }
    .panel button { font: inherit; color: var(--bg); background: var(--cyan); border: 0; padding: 4px 8px; cursor: pointer; }
    .pals { border: 1px solid var(--cyan); display: grid; gap: 2px; }
    .panel output { color: var(--cyan); min-height: 1.4em; }
  </style>
</head>
<body>
  <main class="stage" id="stage"></main>
  <aside class="panel" aria-label="Controlos do ensaio">
    <strong>Cena em canvas · grade 640×360</strong>
    <span id="info">a carregar…</span>
    <fieldset class="pals"><legend>Paleta</legend>
      <label><input type="radio" name="pal" value="dark" checked> Dark</label>
      <label><input type="radio" name="pal" value="light"> Light</label>
      <label><input type="radio" name="pal" value="grey"> Grayscale (referência)</label>
    </fieldset>
    <output id="log" aria-live="polite"></output>
  </aside>
  <script type="module">
    import { initSceneCanvas } from "../../js/scene-canvas.js";
    const info = document.querySelector("#info"), log = document.querySelector("#log");
    const scene = await initSceneCanvas(document.querySelector("#stage"), {
      src: "../../assets/scene/sprites.json",
      theme: "dark",
      onOpen: l => { log.textContent = `clique: ${l.hotspot.label}${l.hotspot.modal ? ` → #${l.hotspot.modal}` : ""}`; },
    });
    const show = () => { info.textContent = `escala ×${scene.scale} em pixels de dispositivo · DPR ${devicePixelRatio}`; };
    show(); addEventListener("resize", show);

    /* Só prova o mecanismo: cada cor puxada 30% para um creme quente. Uma paleta
       de dia a sério é escolhida à mão, cor a cor. */
    const mix = h => {
      const c = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)), t = [255, 243, 224];
      return "#" + c.map((v, i) => Math.round(v + (t[i] - v) * 0.3).toString(16).padStart(2, "0")).join("") + h.slice(7);
    };
    /* Luminância relativa (Rec. 709, sobre valores lineares): o cinzento que a
       cor tem de facto para o olho, não a média dos três canais */
    const grey = h => {
      const lin = v => (v /= 255) <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
      const [r, g, b] = [1, 3, 5].map(i => lin(parseInt(h.slice(i, i + 2), 16)));
      const y = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      const v = Math.round(255 * (y <= 0.0031308 ? 12.92 * y : 1.055 * y ** (1 / 2.4) - 0.055));
      return "#" + v.toString(16).padStart(2, "0").repeat(3) + h.slice(7);
    };
    document.querySelectorAll("input[name=pal]").forEach(r => r.addEventListener("change", () => scene.setTheme(r.value)));
  </script>
</body>
</html>
