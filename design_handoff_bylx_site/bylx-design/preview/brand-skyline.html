<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 14px 18px; background: #09051b; color: var(--bylx-text); }
  .title { font-family: var(--font-ui); font-size: 9px; color: var(--bylx-cyan); text-transform: uppercase; margin: 0 0 12px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-items: center; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px; background: var(--bylx-bg-ink); border: 2px solid var(--bylx-pink); }
  .cell img { image-rendering: pixelated; height: 56px; width: auto; }
  .lbl { font-family: var(--font-ui); font-size: 7px; color: var(--bylx-muted); text-transform: uppercase; }
</style></head>
<body>
  <p class="title">City skyline — Rio + Lisbon silhouettes (hero diorama)</p>
  <div class="row">
    <div class="cell"><img src="../assets/hero/cristo_redentor.png" alt=""/><span class="lbl">Cristo Redentor</span></div>
    <div class="cell"><img src="../assets/hero/pao_de_acucar.png" alt=""/><span class="lbl">Pão de Açúcar</span></div>
    <div class="cell"><img src="../assets/hero/ponte_25abril.png" alt=""/><span class="lbl">Ponte 25 de Abril</span></div>
    <div class="cell"><img src="../assets/hero/torre_belem.png" alt=""/><span class="lbl">Torre de Belém</span></div>
  </div>
</body></html>
