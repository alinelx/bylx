<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 20px; background: #5d3fd3; color: var(--bylx-text); }
  .title { font-family: var(--font-ui); font-size: 9px; color: var(--bylx-cyan); text-transform: uppercase; margin: 0 0 14px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; place-items: center; }
  img { image-rendering: pixelated; height: 50px; width: auto; }
  .lbl { font-family: var(--font-ui); font-size: 7px; color: var(--bylx-text); text-transform: uppercase; opacity: .9; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
</style></head>
<body>
  <p class="title">Particles — sakura petals for ambient atmosphere</p>
  <div class="row">
    <div class="cell"><img src="../assets/particles/sakura1.png" alt=""/><span class="lbl">1</span></div>
    <div class="cell"><img src="../assets/particles/sakura2.png" alt=""/><span class="lbl">2</span></div>
    <div class="cell"><img src="../assets/particles/sakura3.png" alt=""/><span class="lbl">3</span></div>
    <div class="cell"><img src="../assets/particles/sakura4.png" alt=""/><span class="lbl">4</span></div>
  </div>
</body></html>
