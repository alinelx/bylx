<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 18px; background: #f7f5fb; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .sw { aspect-ratio: 1 / 1; padding: 10px; border: 4px solid var(--bylx-bg); display: flex; flex-direction: column; justify-content: space-between; }
  .sw small { font-family: var(--font-ui); font-size: 7px; line-height: 1.4; opacity: .9; }
  .sw strong { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
  .dark { color: var(--bylx-text); }
  .light { color: var(--bylx-bg); }
</style></head>
<body>
  <div class="row">
    <div class="sw dark" style="background:#1d1640"><strong>bg-ink</strong><small>#1d1640</small></div>
    <div class="sw light" style="background:#fff8ff"><strong>paper</strong><small>#fff8ff</small></div>
    <div class="sw light" style="background:#f7f2ff"><strong>text</strong><small>#f7f2ff</small></div>
    <div class="sw light" style="background:#d8d0ff"><strong>muted</strong><small>#d8d0ff</small></div>
    <div class="sw dark" style="background:#2a1c84"><strong>purple-ink</strong><small>#2a1c84</small></div>
    <div class="sw dark" style="background:#c33a8e"><strong>pink-ink</strong><small>#c33a8e</small></div>
    <div class="sw dark" style="background:#2bb8c8"><strong>cyan-ink</strong><small>#2bb8c8</small></div>
    <div class="sw dark" style="background:rgba(9,5,27,0.78); outline:2px dashed #999; outline-offset:-6px"><strong>overlay</strong><small>bg @ 78%</small></div>
    <div class="sw dark" style="background:rgba(9,5,27,0.88)"><strong>overlay+</strong><small>bg @ 88%</small></div>
    <div class="sw light" style="background:#fff; outline:2px solid #ddd; outline-offset:-2px"><strong style="color:#bbb">NO BLACK</strong><small style="color:#bbb">forbidden</small></div>
  </div>
</body></html>
