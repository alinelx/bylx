<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 22px; background: #f7f5fb; color: var(--bylx-bg); }
  .title { font-family: var(--font-ui); font-size: 9px; text-transform: uppercase; margin: 0 0 16px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; align-items: center; }
  .b { background: var(--bylx-paper); width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; }
  .b.s1 { border: 2px solid var(--bylx-bg); }
  .b.s2 { border: 4px solid var(--bylx-cyan); }
  .b.s3 { border: 7px solid var(--bylx-cyan); }
  .b.s4 { border: 7px solid var(--bylx-cyan); box-shadow: 0 0 0 3px rgba(89,243,255,0.9); }
  .demo { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .tag { font-family: var(--font-ui); font-size: 7px; text-transform: uppercase; }
  .val { font-family: var(--font-display); font-size: 12px; color: #555; }
</style></head>
<body>
  <p class="title">Borders & focus — square corners (radius 0), 2/4/7px strokes</p>
  <div class="row">
    <div class="demo"><div class="b s1"></div><span class="tag">Hairline</span><span class="val">2px ink</span></div>
    <div class="demo"><div class="b s2"></div><span class="tag">Card</span><span class="val">4px cyan</span></div>
    <div class="demo"><div class="b s3"></div><span class="tag">Hero</span><span class="val">7px cyan</span></div>
    <div class="demo"><div class="b s4"></div><span class="tag">Focus</span><span class="val">+ ring</span></div>
  </div>
</body></html>
