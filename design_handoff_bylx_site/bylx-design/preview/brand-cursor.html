<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 20px; background: #09051b; color: var(--bylx-text); }
  .title { font-family: var(--font-ui); font-size: 9px; color: var(--bylx-cyan); text-transform: uppercase; margin: 0 0 14px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .cell { background: var(--bylx-bg-ink); border: 3px solid var(--bylx-cyan); padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 72px; }
  .cell img { image-rendering: pixelated; height: 36px; width: 36px; image-rendering: pixelated; }
  .lbl { font-family: var(--font-ui); font-size: 7px; color: var(--bylx-muted); text-transform: uppercase; }
</style></head>
<body>
  <p class="title">Cursor states — replaces OS pointer site-wide</p>
  <div class="row">
    <div class="cell"><img src="../assets/cursor/arrow.png" alt=""/><span class="lbl">Default</span></div>
    <div class="cell"><img src="../assets/cursor/pointer.png" alt=""/><span class="lbl">Hover (a, button)</span></div>
    <div class="cell"><img src="../assets/cursor/click.png" alt=""/><span class="lbl">Mouse-down</span></div>
  </div>
</body></html>
