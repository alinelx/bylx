<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 20px; background: #09051b; color: var(--bylx-text); }
  .title { font-family: var(--font-ui); font-size: 9px; color: var(--bylx-cyan); text-transform: uppercase; margin: 0 0 14px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .cell { background: var(--bylx-bg-ink); border: 3px solid var(--bylx-cyan); padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .cell img { image-rendering: pixelated; height: 50px; width: auto; }
  .lbl { font-family: var(--font-ui); font-size: 7px; color: var(--bylx-muted); text-transform: uppercase; text-align: center; }
</style></head>
<body>
  <p class="title">Prop icons — diorama hotspots = navigation</p>
  <div class="row">
    <div class="cell"><img src="../assets/hero/instax.png" alt=""/><span class="lbl">Instax → Gallery</span></div>
    <div class="cell"><img src="../assets/hero/phone.png" alt=""/><span class="lbl">Phone → Contact</span></div>
    <div class="cell"><img src="../assets/hero/mp3_player.png" alt=""/><span class="lbl">MP3 → Music</span></div>
    <div class="cell"><img src="../assets/hero/cocktail.png" alt=""/><span class="lbl">Decorative</span></div>
  </div>
</body></html>
