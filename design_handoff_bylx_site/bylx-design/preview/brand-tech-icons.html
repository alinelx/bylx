<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 20px; background: #09051b; color: var(--bylx-text); }
  .title { font-family: var(--font-ui); font-size: 9px; color: var(--bylx-cyan); text-transform: uppercase; margin: 0 0 12px; }
  .row { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; }
  .demo { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .demo img { image-rendering: pixelated; height: 36px; width: auto; }
  .lbl { font-family: var(--font-ui); font-size: 7px; color: var(--bylx-muted); text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; padding: 10px; background: #5d3fd3; border: 3px solid var(--bylx-bg); width: 360px; }
  .grid img { width: 100%; image-rendering: pixelated; }
</style></head>
<body>
  <p class="title">Tech icons — desktop sprites, used as-is, never redrawn</p>
  <div class="grid">
    <img src="../assets/hero/html_icon.png" alt="html"/>
    <img src="../assets/hero/css_icon.png" alt="css"/>
    <img src="../assets/hero/javascript_icon.png" alt="js"/>
    <img src="../assets/hero/typescript_icon.png" alt="ts"/>
    <img src="../assets/hero/react_icon.png" alt="react"/>
    <img src="../assets/hero/node_icon.png" alt="node"/>
    <img src="../assets/hero/figma_icon.png" alt="figma"/>
    <img src="../assets/hero/wordpress_icon.png" alt="wp"/>
  </div>
</body></html>
