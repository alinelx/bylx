<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 22px; background: #09051b; color: var(--bylx-text); display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .title { font-family: var(--font-ui); font-size: 9px; color: var(--bylx-cyan); text-transform: uppercase; width: 100%; margin: 0; }
  .btn { font-family: "Press Start 2P", monospace; font-size: 13px; padding: 12px 16px; border: 2px solid rgba(9, 5, 27, 0.72); background: var(--bylx-pink); color: var(--bylx-cyan); text-decoration: none; text-transform: uppercase; word-spacing: 0.12rem; cursor: pointer; -webkit-font-smoothing: none; }
  .btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 rgba(89, 243, 255, 0.82); }
  .btn.alt { background: var(--bylx-cyan); color: var(--bylx-bg); border-color: var(--bylx-bg); }
  .btn.modal { background: var(--bylx-pink); color: var(--bylx-bg); border: 3px solid var(--bylx-bg); font-size: 11px; padding: 9px 12px; }
  .btn.ghost { background: transparent; color: var(--bylx-cyan); border: 3px solid var(--bylx-cyan); }
  .lbl { font-family: var(--font-ui); font-size: 7px; color: var(--bylx-muted); text-transform: uppercase; display: block; margin-top: 8px; text-align: center; }
  .demo { display: flex; flex-direction: column; align-items: center; }
</style></head>
<body>
  <p class="title">Buttons — Press Start 2P, uppercase, hard pink/cyan fills</p>
  <div class="demo"><a class="btn" href="#">VIEW PROJECTS</a><span class="lbl">Primary CTA</span></div>
  <div class="demo"><button class="btn alt">SAY HI</button><span class="lbl">Secondary</span></div>
  <div class="demo"><button class="btn modal">SEND</button><span class="lbl">Modal action</span></div>
  <div class="demo"><button class="btn ghost">RESUME</button><span class="lbl">Ghost</span></div>
</body></html>
