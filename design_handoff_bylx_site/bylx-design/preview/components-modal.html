<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 16px; background: rgba(9,5,27,0.76); color: var(--bylx-bg); }
  .modal { width: 92%; margin: 0 auto; background: #fff8ff; border: 4px solid var(--bylx-cyan); box-shadow: 8px 8px 0 var(--bylx-pink); }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 9px 12px; background: var(--bylx-cyan); border-bottom: 4px solid var(--bylx-bg); }
  .head h2 { margin: 0; font-family: var(--font-display); font-size: 22px; line-height: 1; color: var(--bylx-bg); }
  .close { padding: 2px 9px; border: 2px solid var(--bylx-bg); background: var(--bylx-pink); color: var(--bylx-bg); font-family: var(--font-display); font-size: 18px; line-height: 1; cursor: pointer; }
  .body { padding: 14px 16px 18px; font-family: var(--font-display); font-size: 14px; line-height: 1.2; color: #222; }
</style></head>
<body>
  <section class="modal">
    <header class="head"><h2>Gallery</h2><button class="close">×</button></header>
    <div class="body">Pixel modals open instantly — no fade, no blur. Cyan header bar with chunky ink border. Pink close button.</div>
  </section>
</body></html>
