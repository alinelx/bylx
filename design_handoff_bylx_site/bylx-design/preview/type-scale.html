<!-- @dsCard group="Type" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 16px 22px; background: #09051b; color: var(--bylx-text); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 10px 6px 0; font-family: var(--font-display); font-size: 14px; border-bottom: 1px dashed rgba(216,208,255,0.18); }
  th { font-family: var(--font-ui); font-size: 8px; color: var(--bylx-cyan); text-transform: uppercase; padding-bottom: 8px; border-bottom: 2px solid var(--bylx-cyan); }
  td.spec { font-family: var(--font-display); }
  td.tok { font-family: var(--font-ui); font-size: 8px; color: var(--bylx-muted); }
  .px { color: var(--bylx-pink); }
</style></head>
<body>
  <table>
    <thead><tr><th>Specimen</th><th>Token</th><th>Size</th></tr></thead>
    <tbody>
      <tr><td class="spec" style="font-size:42px;line-height:.96">Display</td><td class="tok">--fs-display</td><td class="tok">5rem</td></tr>
      <tr><td class="spec" style="font-size:28px;line-height:.96">Heading 1</td><td class="tok">--fs-h1</td><td class="tok">3.4rem</td></tr>
      <tr><td class="spec" style="font-size:22px;line-height:1">Heading 2</td><td class="tok">--fs-h2</td><td class="tok">2.4rem</td></tr>
      <tr><td class="spec" style="font-size:17px;line-height:1.1">Heading 3</td><td class="tok">--fs-h3</td><td class="tok">1.6rem</td></tr>
      <tr><td class="spec" style="font-size:14px">Body large</td><td class="tok">--fs-body-lg</td><td class="tok">1.2rem</td></tr>
      <tr><td class="spec" style="font-size:12px;color:var(--bylx-muted)">Caption</td><td class="tok">--fs-caption</td><td class="tok">0.85rem</td></tr>
    </tbody>
  </table>
</body></html>
