<!-- @dsCard group="Type" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px 28px; background: #09051b; color: var(--bylx-text); -webkit-font-smoothing: none; }
  .row { display: flex; flex-direction: column; gap: 14px; }
  .ex { display: flex; align-items: baseline; gap: 18px; }
  .lbl { font-family: var(--font-ui); font-size: 8px; color: var(--bylx-muted); width: 80px; text-transform: uppercase; }
  .ps { font-family: "Press Start 2P", monospace; color: var(--bylx-cyan); -webkit-font-smoothing: none; }
  .ps.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0; }
  .ps.cta { font-size: 14px; padding: 9px 12px; background: var(--bylx-pink); color: var(--bylx-bg); border: 2px solid var(--bylx-bg); display: inline-block; }
  .ps.kbd { font-size: 10px; padding: 4px 7px; border: 2px solid var(--bylx-cyan); background: var(--bylx-bg-ink); }
  .ps.title { font-size: 9px; color: var(--bylx-bg); background: var(--bylx-cyan); padding: 5px 8px; }
</style></head>
<body>
  <div class="row">
    <div class="ex"><span class="lbl">Eyebrow</span><span class="ps eyebrow">FRONT-END DEVELOPER IN PROGRESS</span></div>
    <div class="ex"><span class="lbl">CTA</span><span class="ps cta">VIEW PROJECTS</span></div>
    <div class="ex"><span class="lbl">Window</span><span class="ps title">NIHON.BMP</span></div>
    <div class="ex"><span class="lbl">Kbd / tag</span><span class="ps kbd">ESC</span><span class="ps kbd">⌘ K</span><span class="ps kbd">v1.0</span></div>
  </div>
</body></html>
