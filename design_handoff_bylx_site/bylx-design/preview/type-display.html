<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 22px 28px; background: #09051b; color: var(--bylx-text); }
  .tag { font-family: var(--font-ui); font-size: 9px; color: var(--bylx-cyan); text-transform: uppercase; margin: 0 0 6px; }
  .specimen { font-family: var(--font-display); font-weight: 500; line-height: 0.96; margin: 0 0 18px; }
  .h1 { font-size: 56px; }
  .h2 { font-size: 38px; }
  .h3 { font-size: 26px; color: var(--bylx-muted); }
  .meta { font-family: var(--font-ui); font-size: 8px; color: var(--bylx-muted); opacity: .8; }
</style></head>
<body>
  <p class="tag">Display — Pixelify Sans</p>
  <p class="specimen h1">Designing playful, useful web experiences</p>
  <p class="specimen h2">Front-end in progress</p>
  <p class="specimen h3">A learner's portfolio, owning the energy</p>
  <p class="meta">weights 400–700 · line-height 0.96 · letter-spacing 0 · text-wrap balance</p>
</body></html>
