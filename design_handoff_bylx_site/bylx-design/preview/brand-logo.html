<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 18px; background: #09051b; color: var(--bylx-text); }
  .title { font-family: var(--font-ui); font-size: 9px; color: var(--bylx-cyan); text-transform: uppercase; margin: 0 0 14px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .cell { background: var(--bylx-bg-ink); border: 3px solid var(--bylx-cyan); padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .cell img { image-rendering: pixelated; height: 56px; width: auto; }
  .lbl { font-family: var(--font-ui); font-size: 7px; color: var(--bylx-muted); text-transform: uppercase; }
  .cell.light { background: var(--bylx-paper); border-color: var(--bylx-bg); }
  .cell.light .lbl { color: var(--bylx-bg); }
</style></head>
<body>
  <p class="title">Logo — pixel wordmark, 6 variants</p>
  <div class="row">
    <div class="cell"><img src="../assets/logo/bylx_logo.png" alt=""/><span class="lbl">Full color · .dev</span></div>
    <div class="cell"><img src="../assets/logo/bylx_logo_semdev.png" alt=""/><span class="lbl">Full color · no .dev</span></div>
    <div class="cell"><img src="../assets/logo/bylx_logo_line.png" alt=""/><span class="lbl">Outline</span></div>
    <div class="cell"><img src="../assets/logo/bylx_logo_line_cyan.png" alt=""/><span class="lbl">Outline · cyan</span></div>
    <div class="cell"><img src="../assets/logo/bylx_logo_line_pink.png" alt=""/><span class="lbl">Outline · pink</span></div>
    <div class="cell"><img src="../assets/logo/bylx_logo_line_purple.png" alt=""/><span class="lbl">Outline · purple</span></div>
  </div>
</body></html>
