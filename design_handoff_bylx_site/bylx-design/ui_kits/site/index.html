<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>bylx.dev — UI kit</title>
  <link rel="icon" href="../../assets/logo/bylx_logo_semdev.png" type="image/png"/>

  <link rel="stylesheet" href="../../colors_and_type.css"/>
  <link rel="stylesheet" href="hero-diorama.css"/>
  <link rel="stylesheet" href="mp3-player.css"/>
  <link rel="stylesheet" href="sakura-cursor.css"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body, * { cursor: none !important; }
    @media (max-width: 520px) {
      html, body, * { cursor: auto !important; }
      .bylx-cursor { display: none; }
    }

    body {
      margin: 0;
      min-width: 320px;
      overflow-x: hidden;
      background: var(--bylx-bg);
      color: var(--bylx-text);
      font-family: var(--font-display);
    }

    /* Pixel cursor */
    .bylx-cursor {
      position: fixed;
      top: 0; left: 0;
      z-index: 99999;
      width: 32px; height: 32px;
      pointer-events: none;
      background-image: url("../../assets/cursor/arrow.png");
      background-repeat: no-repeat;
      background-size: contain;
      image-rendering: pixelated;
      transform: translate(-4px, -4px);
      will-change: transform;
      transition: opacity .15s ease, background-image .08s linear;
    }
    .bylx-cursor.hover { background-image: url("../../assets/cursor/pointer.png"); }
    .bylx-cursor.click {
      background-image: url("../../assets/cursor/click.png");
      transform: translate(-4px, -4px) scale(0.95);
    }

    /* Hero copy panel — uses the info card React component */
    .bylx-hero-copy .bylx-info-card { width: min(28rem, 30vw); }

    @media (max-width: 1180px) {
      .bylx-hero-copy .bylx-info-card { width: min(14rem, 23vw); }
    }
    @media (max-width: 1400px) {
      .bylx-hero-scene { min-height: 780px; }
      .bylx-hero-artboard { min-width: 0; }
      .bylx-hero-copy { top: clamp(.8rem, 2.5vw, 1.2rem); left: clamp(.8rem, 2.5vw, 1.2rem); }
      .bylx-hero-copy .bylx-info-card { width: min(16rem, calc(100% - 1.6rem)); }
    }

    /* Below-the-fold sections */
    .bylx-section {
      min-height: 60vh;
      padding: 2.5rem clamp(1rem, 5vw, 5rem);
      background: var(--bylx-bg);
    }
    .bylx-section h2 {
      margin: 0 0 1.2rem;
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 500;
      line-height: 0.96;
    }
    .bylx-section p { max-width: 36rem; }
    .bylx-eyebrow {
      margin: 0 0 .6rem;
      color: var(--bylx-cyan);
      font-family: var(--font-ui);
      font-size: .7rem;
      letter-spacing: 0;
      text-transform: uppercase;
      -webkit-font-smoothing: none;
    }

    /* Projects grid */
    .bylx-projects-grid {
      display: grid;
      gap: 1.2rem;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      max-width: 64rem;
      margin-top: 1.6rem;
    }
    .bylx-project-card {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 1rem 1.1rem 1.1rem;
      background: var(--bylx-bg-ink);
      border: 4px solid var(--bylx-cyan);
      box-shadow: 6px 6px 0 var(--bylx-pink);
      color: var(--bylx-text);
      text-decoration: none;
      transition: transform 80ms steps(2, end), box-shadow 80ms steps(2, end);
    }
    .bylx-project-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0 var(--bylx-pink);
    }
    .bylx-project-sub {
      margin: 0;
      font-family: var(--font-ui);
      font-size: 0.55rem;
      letter-spacing: 0;
      color: var(--bylx-cyan);
      text-transform: uppercase;
      -webkit-font-smoothing: none;
    }
    .bylx-project-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--bylx-pink);
      line-height: 1;
    }
    .bylx-project-desc {
      margin: 0;
      font-size: 1rem;
      color: var(--bylx-muted);
      line-height: 1.18;
    }
    .bylx-project-stack {
      margin: 0.5rem 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .bylx-project-stack li {
      font-family: var(--font-ui);
      font-size: 0.5rem;
      padding: 4px 6px;
      background: var(--bylx-bg);
      color: var(--bylx-cyan);
      border: 2px solid var(--bylx-cyan);
      text-transform: uppercase;
      -webkit-font-smoothing: none;
    }

    /* Gallery image grid */
    .bylx-gallery-grid {
      display: grid;
      gap: 0.6rem;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      grid-auto-rows: 110px;
    }
    .bylx-gallery-cell {
      position: relative;
      margin: 0;
      background: var(--bylx-bg);
      border: 3px solid var(--bylx-bg);
      box-shadow: 3px 3px 0 var(--bylx-pink);
      overflow: hidden;
    }
    .bylx-gallery-cell.is-tall { grid-row: span 2; }
    .bylx-gallery-cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
      display: block;
    }
    .bylx-gallery-cell figcaption {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 4px 6px;
      font-family: var(--font-ui);
      font-size: 0.45rem;
      color: var(--bylx-text);
      background: rgba(9, 5, 27, 0.78);
      text-transform: uppercase;
      -webkit-font-smoothing: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React 18 + Babel (required pinned versions) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Components -->
  <script type="text/babel" src="Button.jsx"></script>
  <script type="text/babel" src="InfoCard.jsx"></script>
  <script type="text/babel" src="Modal.jsx"></script>
  <script type="text/babel" src="ContactForm.jsx"></script>
  <script type="text/babel" src="Mp3Player.jsx"></script>
  <script type="text/babel" src="PixelCursor.jsx"></script>
  <script type="text/babel" src="SakuraCursor.jsx"></script>
  <script type="text/babel" src="HeroDiorama.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>
</body>
</html>
